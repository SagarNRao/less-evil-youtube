<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="popup-content" id="modalForShorts">
      <h2>YouTube Short</h2>
      <div class="flex items-center gap-4">
        <div
          class="video-container"
          style="
            position: relative;
            width: 350px;
            height: 622px;
            margin: 0 auto;
          "
        >
          <iframe
            width="100%"
            height="100%"
            src="https://www.youtube.com/embed/${videoId}?autoplay=1"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            style="position: absolute; top: 0; left: 0"
          ></iframe>
        </div>
        <div class="flex flex-col gap-4">
          <button class="px-4 py-2 bg-gray-200 rounded">Like</button>
          <button class="px-4 py-2 bg-gray-200 rounded">Dislike</button>
          <button class="px-4 py-2 bg-gray-200 rounded">Share</button>
        </div>

        <div />
      </div>
    </div>

  </body>
</html>
